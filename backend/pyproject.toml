# Copyright The Robinauts Authors

[project]
name = "robinauts"
version = "0.1.0"
description = "Conversational agents that play fair: the Robinauts backend."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "The Robinauts Authors" }]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
    "import-linter>=2.0",
]

[project.scripts]
robinauts = "robinauts.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robinauts"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["robinauts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The gate scripts are not part of the robinauts package, but their pure
# logic is tested like anything else.
pythonpath = ["src", "tests", "../scripts"]
markers = [
    "io: tests that touch the network, the file system, a database or a local server (slow)",
]

# ---------------------------------------------------------------------------
# Architecture rules. See docs/layout.md section 3 for the dependency matrix.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "robinauts"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain imports nothing from robinauts"
type = "forbidden"
source_modules = ["robinauts.domain"]
forbidden_modules = [
    "robinauts.core",
    "robinauts.ports",
    "robinauts.application",
    "robinauts.api",
    "robinauts.adapters",
    "robinauts.datastore",
    "robinauts.app",
    "robinauts.cli",
]

[[tool.importlinter.contracts]]
name = "core imports only domain"
type = "forbidden"
source_modules = ["robinauts.core"]
forbidden_modules = [
    "robinauts.ports",
    "robinauts.application",
    "robinauts.api",
    "robinauts.adapters",
    "robinauts.datastore",
    "robinauts.app",
    "robinauts.cli",
]

[[tool.importlinter.contracts]]
name = "ports import only domain"
type = "forbidden"
source_modules = ["robinauts.ports"]
forbidden_modules = [
    "robinauts.core",
    "robinauts.application",
    "robinauts.api",
    "robinauts.adapters",
    "robinauts.datastore",
    "robinauts.app",
    "robinauts.cli",
]

[[tool.importlinter.contracts]]
name = "application imports only ports, core and domain"
type = "forbidden"
source_modules = ["robinauts.application"]
forbidden_modules = [
    "robinauts.api",
    "robinauts.adapters",
    "robinauts.datastore",
    "robinauts.app",
    "robinauts.cli",
]

[[tool.importlinter.contracts]]
name = "api imports only application and domain"
type = "forbidden"
source_modules = ["robinauts.api"]
forbidden_modules = [
    "robinauts.core",
    "robinauts.ports",
    "robinauts.adapters",
    "robinauts.datastore",
    "robinauts.app",
    "robinauts.cli",
]

[[tool.importlinter.contracts]]
name = "adapters import only ports and domain"
type = "forbidden"
source_modules = ["robinauts.adapters"]
forbidden_modules = [
    "robinauts.core",
    "robinauts.application",
    "robinauts.api",
    "robinauts.datastore",
    "robinauts.app",
    "robinauts.cli",
]

[[tool.importlinter.contracts]]
name = "datastore imports only ports and domain"
type = "forbidden"
source_modules = ["robinauts.datastore"]
forbidden_modules = [
    "robinauts.core",
    "robinauts.application",
    "robinauts.api",
    "robinauts.adapters",
    "robinauts.app",
    "robinauts.cli",
]

# The agent frameworks are swappable: each is confined to its own adapter.
[[tool.importlinter.contracts]]
name = "LangGraph and LangChain only under adapters.agents.langgraph"
type = "forbidden"
source_modules = [
    "robinauts.domain",
    "robinauts.core",
    "robinauts.ports",
    "robinauts.application",
    "robinauts.api",
    "robinauts.datastore",
    "robinauts.adapters.agents.pydantic_ai",
    "robinauts.app",
    "robinauts.cli",
]
forbidden_modules = ["langgraph", "langchain", "langchain_core"]

[[tool.importlinter.contracts]]
name = "Pydantic AI only under adapters.agents.pydantic_ai"
type = "forbidden"
source_modules = [
    "robinauts.domain",
    "robinauts.core",
    "robinauts.ports",
    "robinauts.application",
    "robinauts.api",
    "robinauts.datastore",
    "robinauts.adapters.agents.langgraph",
    "robinauts.app",
    "robinauts.cli",
]
forbidden_modules = ["pydantic_ai"]

[[tool.importlinter.contracts]]
name = "the two agent adapters do not import each other"
type = "independence"
modules = [
    "robinauts.adapters.agents.langgraph",
    "robinauts.adapters.agents.pydantic_ai",
]
